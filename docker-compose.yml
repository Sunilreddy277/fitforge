services:

  postgres:
    image: postgres:17
    container_name: fitforge-postgres
    environment:
      POSTGRES_DB: fitforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: fitforge-backend:latest
    container_name: fitforge-backend
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fitforge
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      - postgres

volumes:
  postgres-data: